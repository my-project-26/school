<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schul App - Lernportal</title>
    <style>
        :root {
            --primary-color: #2b7fff;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --accent-yellow: #ffdb58;
            --accent-green: #2ecc71;
            --btn-hover: #1a62d1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Top Bar Navigation */
        .top-bar {
            width: 100%;
            background-color: var(--primary-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .btn-nav {
            background: #ffffff;
            color: var(--primary-color);
            border: 2px solid #ffffff;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s ease;
        }

        .btn-nav:active {
            transform: scale(0.95);
        }

        .score-badge {
            background-color: #1a62d1;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
        }

        /* Main Container */
        .app-container {
            width: 92%;
            max-width: 480px;
            background: var(--card-bg);
            margin-top: 20px;
            margin-bottom: 30px;
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            color: var(--primary-color);
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 16px;
        }

        /* Views (SPA Umschaltung) */
        .view-section {
            display: none;
            width: 100%;
            flex-direction: column;
        }

        .view-section.active {
            display: flex;
        }

        /* Hauptmenü Kacheln */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
        }

        .menu-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 18px;
            padding: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: border-color 0.2s, transform 0.1s;
        }

        .menu-card:active {
            border-color: var(--primary-color);
            transform: scale(0.98);
        }

        .menu-card-icon {
            font-size: 2.2rem;
            background: #e0f2fe;
            padding: 12px;
            border-radius: 14px;
        }

        .menu-card-info h2 {
            font-size: 1.2rem;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .menu-card-info p {
            font-size: 0.9rem;
            color: #64748b;
        }

        /* Übungsansicht Layout */
        .instruction-box {
            width: 100%;
            text-align: left;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .instruction-text {
            font-size: 1.25rem;
            color: #2c3e50;
            font-weight: 700;
            line-height: 1.4;
            white-space: normal;
            word-wrap: break-word;
        }

        .audio-btn {
            background-color: var(--accent-yellow);
            border: none;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            min-height: 52px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .audio-btn:active {
            transform: scale(0.98);
        }

        .display-card {
            background-color: #f8fafc;
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }

        .word-display {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #1e293b;
        }

        .missing-letter {
            color: var(--primary-color);
            border-bottom: 4px solid var(--primary-color);
            padding-bottom: 2px;
        }

        .hint-text {
            color: #64748b;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .option-btn {
            background: white;
            border: 3px solid var(--primary-color);
            color: var(--primary-color);
            font-size: 1.8rem;
            font-weight: bold;
            padding: 16px 8px;
            border-radius: 20px;
            cursor: pointer;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.1s ease, transform 0.1s ease;
        }

        .option-btn:active {
            background-color: var(--primary-color);
            color: white;
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- Header mit funktionalem Menü-Button -->
    <div class="top-bar">
        <button class="btn-nav" id="mainMenuNavBtn" onclick="showView('main-menu')">
            <span>☰</span> <span id="navTitle">Hauptmenü</span>
        </button>
        <div class="score-badge" id="scoreDisplay">Punkte: 0</div>
    </div>

    <div class="app-container">

        <!-- ANSICHT 1: HAUPTMENÜ -->
        <div id="view-main-menu" class="view-section active">
            <h1 class="main-title">Lernbereiche</h1>
            <div class="menu-grid">
                <div class="menu-card" onclick="startExercise('rechtschreibung')">
                    <div class="menu-card-icon">✏️</div>
                    <div class="menu-card-info">
                        <h2>Rechtschreibung</h2>
                        <p>Ableiten & Verlängern (3. Klasse)</p>
                    </div>
                </div>
                
                <div class="menu-card" onclick="startExercise('1x1')">
                    <div class="menu-card-icon">🔢</div>
                    <div class="menu-card-info">
                        <h2>1x1 Trainer</h2>
                        <p>Einmaleins automatisieren</p>
                    </div>
                </div>

                <div class="menu-card" onclick="startExercise('anlaute')">
                    <div class="menu-card-icon">🔤</div>
                    <div class="menu-card-info">
                        <h2>Anlaute hören</h2>
                        <p>Audio-Training (1. Klasse)</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- ANSICHT 2: ÜBUNGSMODUL RECHTSCHREIBSTRATEGIEN -->
        <div id="view-exercise" class="view-section">
            <h1 class="main-title" id="exerciseTitle">Rechtschreibstrategien</h1>
            
            <div class="instruction-box">
                <div class="instruction-text" id="instructionText">
                    Leite ab von Baum
                </div>
            </div>

            <button class="audio-btn" id="playAudioBtn">
                🔊 Wort anhören
            </button>

            <div class="display-card">
                <div class="word-display" id="wordDisplay">
                    B<span class="missing-letter">?</span>
                </div>
                <div class="hint-text" id="hintText">
                    💡 Tipp: Ableiten von Baum
                </div>
            </div>

            <div class="options-grid" id="optionsContainer"></div>
        </div>

    </div>

    <script>
        // Aufgabenkatalog für Rechtschreibstrategien (Klasse 3)
        const spellingTasks = [
            {
                baseWord: "Baum",
                targetWord: "Bäume",
                audioFile: "audio/Baeume.mp3",
                prefix: "B",
                correctEnding: "äume",
                wrongEnding: "ume"
            },
            {
                baseWord: "Bär",
                targetWord: "Bären",
                audioFile: "audio/Baeren.mp3",
                prefix: "B",
                correctEnding: "ären",
                wrongEnding: "eren"
            },
            {
                baseWord: "Haus",
                targetWord: "Häuser",
                audioFile: "audio/Haeuser.mp3",
                prefix: "H",
                correctEnding: "äuser",
                wrongEnding: "euser"
            },
            {
                baseWord: "Hand",
                targetWord: "Hände",
                audioFile: "audio/Haende.mp3",
                prefix: "H",
                correctEnding: "ände",
                wrongEnding: "ende"
            }
        ];

        let currentTaskIndex = 0;
        let score = parseInt(localStorage.getItem('schulapp_score') || '90');
        window.activeAudio = null;

        // Punkte im UI und LocalStorage aktualisieren
        function updateScore(points) {
            score = points;
            localStorage.setItem('schulapp_score', score.toString());
            document.getElementById('scoreDisplay').innerText = `Punkte: ${score}`;
        }

        // View-Management (Hauptmenü <-> Übung)
        function showView(viewId) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.getElementById(`view-${viewId}`).classList.add('active');

            const navTitle = document.getElementById('navTitle');
            if (viewId === 'main-menu') {
                navTitle.innerText = "Hauptmenü";
                if (window.activeAudio) window.activeAudio.pause();
            } else {
                navTitle.innerText = "≡ Menü";
            }
        }

        // Startet das gewählte Modul
        function startExercise(moduleType) {
            if (moduleType === 'rechtschreibung') {
                document.getElementById('exerciseTitle').innerText = "Rechtschreibstrategien";
                showView('exercise');
                renderSpellingTask();
            } else {
                alert("Dieses Modul befindet sich aktuell im Aufbau.");
            }
        }

        // Audio abspielen
        function playAudio(audioPath) {
            if (window.activeAudio) {
                window.activeAudio.pause();
                window.activeAudio.currentTime = 0;
            }
            window.activeAudio = new Audio(audioPath);
            window.activeAudio.play().catch(err => console.warn("Audio-Hinweis:", err));
        }

        // Rendert die Rechtschreibaufgabe
        function renderSpellingTask() {
            const task = spellingTasks[currentTaskIndex];

            // Nur Ausgangswort, kein Verraten der Lösung
            document.getElementById('instructionText').innerText = `Leite ab von ${task.baseWord}`;
            document.getElementById('wordDisplay').innerHTML = `${task.prefix}<span class="missing-letter">?</span>`;
            document.getElementById('hintText').innerText = `💡 Tipp: Ableiten von ${task.baseWord}`;

            // Buttons zufällig mischen (Fisher-Yates Shuffle)
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            const options = [
                { text: task.correctEnding, isCorrect: true },
                { text: task.wrongEnding, isCorrect: false }
            ];

            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => checkSpellingAnswer(opt.isCorrect);
                optionsContainer.appendChild(btn);
            });

            document.getElementById('playAudioBtn').onclick = () => {
                playAudio(task.audioFile);
            };
        }

        function checkSpellingAnswer(isCorrect) {
            if (isCorrect) {
                updateScore(score + 10);
                currentTaskIndex = (currentTaskIndex + 1) % spellingTasks.length;
                renderSpellingTask();
            } else {
                const container = document.getElementById('optionsContainer');
                container.style.transform = 'translateX(-6px)';
                setTimeout(() => container.style.transform = 'translateX(6px)', 50);
                setTimeout(() => container.style.transform = 'translateX(0)', 100);
            }
        }

        // Initialisierung
        window.addEventListener('DOMContentLoaded', () => {
            updateScore(score);
            showView('main-menu');
        });
    </script>
</body>
</html>
