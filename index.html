<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schul App - Rechtschreibstrategien</title>
    <style>
        :root {
            --primary-color: #2b7fff;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --accent-yellow: #ffdb58;
            --btn-hover: #1a62d1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Navigation Bar */
        .top-bar {
            width: 100%;
            background-color: var(--primary-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-nav {
            background: #ffffff;
            color: var(--primary-color);
            border: 2px solid #ffffff;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            min-height: 48px;
        }

        .score-badge {
            background-color: #1a62d1;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
        }

        /* App Main Container */
        .app-container {
            width: 92%;
            max-width: 480px;
            background: var(--card-bg);
            margin-top: 20px;
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            color: var(--primary-color);
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 12px;
        }

        /* Anweisungssatz vollständig linksbündig ohne Abschneiden */
        .instruction-box {
            width: 100%;
            text-align: left;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .instruction-text {
            font-size: 1.15rem;
            color: #2c3e50;
            font-weight: 700;
            line-height: 1.4;
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        /* Audio Button */
        .audio-btn {
            background-color: var(--accent-yellow);
            border: none;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            min-height: 52px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .audio-btn:active {
            transform: scale(0.98);
        }

        /* Wort-Anzeige Kasten */
        .display-card {
            background-color: #f8fafc;
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }

        .word-display {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #1e293b;
        }

        .missing-letter {
            color: var(--primary-color);
            border-bottom: 4px solid var(--primary-color);
            padding-bottom: 2px;
        }

        .hint-text {
            color: #64748b;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Antwort-Buttons Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .option-btn {
            background: white;
            border: 3px solid var(--primary-color);
            color: var(--primary-color);
            font-size: 1.8rem;
            font-weight: bold;
            padding: 16px 8px;
            border-radius: 20px;
            cursor: pointer;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.1s ease, transform 0.1s ease;
        }

        .option-btn:active {
            background-color: var(--primary-color);
            color: white;
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <button class="btn-nav">≡ Rechtschreibung</button>
        <div class="score-badge" id="scoreDisplay">Punkte: 90</div>
    </div>

    <div class="app-container">
        <h1 class="main-title">Rechtschreibstrategien</h1>
        
        <div class="instruction-box">
            <div class="instruction-text" id="instructionText">
                Leite ab von Baum: Bäume
            </div>
        </div>

        <button class="audio-btn" id="playAudioBtn">
            🔊 Wort anhören
        </button>

        <div class="display-card">
            <div class="word-display" id="wordDisplay">
                B<span class="missing-letter">?</span>
            </div>
            <div class="hint-text" id="hintText">
                💡 Tipp: Ableiten von Baum
            </div>
        </div>

        <div class="options-grid" id="optionsContainer"></div>
    </div>

    <script>
        // Aufgaben-Datenbank (Funktioniert für Obst, Gemüse, Tiere, Menschen etc.)
        const tasks = [
            {
                baseWord: "Baum",
                targetWord: "Bäume",
                prefix: "B",
                correctEnding: "äume",
                wrongEnding: "ume"
            },
            {
                baseWord: "Bär",
                targetWord: "Bären",
                prefix: "B",
                correctEnding: "ären",
                wrongEnding: "eren"
            },
            {
                baseWord: "Apfel",
                targetWord: "Äpfel",
                prefix: "",
                correctEnding: "Äpfel",
                wrongEnding: "Epfel"
            },
            {
                baseWord: "Hand",
                targetWord: "Hände",
                prefix: "H",
                correctEnding: "ände",
                wrongEnding: "ende"
            },
            {
                baseWord: "Haus",
                targetWord: "Häuser",
                prefix: "H",
                correctEnding: "äuser",
                wrongEnding: "euser"
            }
        ];

        let currentTaskIndex = 0;
        let score = 90;
        let selectedVoice = null;

        // Sprachausgabe-Optimierung & Normalisierung (Erzwingt 'Baer'-Qualität)
        function normalizeForSpeech(text) {
            return text
                .replace(/ä/g, 'ae')
                .replace(/Ä/g, 'Ae')
                .replace(/ö/g, 'oe')
                .replace(/Ö/g, 'Oe')
                .replace(/ü/g, 'ue')
                .replace(/Ü/g, 'Ue')
                .replace(/ß/g, 'ss');
        }

        function initBestVoice() {
            if ('speechSynthesis' in window) {
                const loadVoices = () => {
                    const voices = window.speechSynthesis.getVoices();
                    // Priorisiere glatte, klare Stimmen
                    selectedVoice = voices.find(v => v.lang.startsWith('de') && 
                        (v.name.includes('Google') || v.name.includes('Anna') || v.name.includes('Helena') || v.name.includes('Clara') || v.name.includes('Natural'))) 
                        || voices.find(v => v.lang.startsWith('de')) 
                        || null;
                };

                loadVoices();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = loadVoices;
                }
            }
        }

        function playClearAudio(rawText) {
            if (!('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel();
            
            // Konvertierung zu Phonetik-Reinschrift für gleichmäßige Qualität
            const spokenText = normalizeForSpeech(rawText);
            const utterance = new SpeechSynthesisUtterance(spokenText);
            utterance.lang = 'de-DE';
            
            // Exakte Parameter-Abstimmung für deutliche Grundschul-Aussprache
            utterance.rate = 0.82; 
            utterance.pitch = 1.0; 
            
            if (selectedVoice) {
                utterance.voice = selectedVoice;
            }

            window.speechSynthesis.speak(utterance);
        }

        function renderTask() {
            const task = tasks[currentTaskIndex];

            // 1. Satz vollständig und linksbündig rendern
            document.getElementById('instructionText').innerText = `Leite ab von ${task.baseWord}: ${task.targetWord}`;
            
            if(task.prefix !== "") {
                document.getElementById('wordDisplay').innerHTML = `${task.prefix}<span class="missing-letter">?</span>`;
            } else {
                document.getElementById('wordDisplay').innerHTML = `<span class="missing-letter">?</span>`;
            }
            
            document.getElementById('hintText').innerText = `💡 Tipp: Ableiten von ${task.baseWord}`;
            
            // 2. Antwort-Buttons zufällig mischen (Fisher-Yates Shuffle)
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            const options = [
                { text: task.correctEnding, isCorrect: true },
                { text: task.wrongEnding, isCorrect: false }
            ];

            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => checkAnswer(opt.isCorrect);
                optionsContainer.appendChild(btn);
            });

            // Audio-Button verknüpfen
            document.getElementById('playAudioBtn').onclick = () => {
                playClearAudio(task.targetWord);
            };
        }

        function checkAnswer(isCorrect) {
            if (isCorrect) {
                score += 10;
                document.getElementById('scoreDisplay').innerText = `Punkte: ${score}`;
                currentTaskIndex = (currentTaskIndex + 1) % tasks.length;
                renderTask();
            } else {
                playClearAudio("Versuche es noch einmal");
            }
        }

        // Freischaltung für Safari Audio-Autoplay beim ersten Klick
        document.addEventListener('touchstart', () => {
            if ('speechSynthesis' in window && window.speechSynthesis.speaking === false) {
                window.speechSynthesis.resume();
            }
        }, { once: true });

        window.addEventListener('DOMContentLoaded', () => {
            initBestVoice();
            renderTask();
        });
    </script>
</body>
</html>
