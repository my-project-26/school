<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Schul App – Grundschule BW</title>
    <style>
        :root {
            --primary-bg: #f4f7f6;
            --card-bg: #ffffff;
            --accent-color: #4a90e2;
            --text-color: #2c3e50;
            --border-radius: 16px;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
        }

        h1 {
            font-size: 1.6rem;
            margin: 8px 0 16px 0;
            text-align: center;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #4a5568;
            margin: 16px 0 10px 0;
            width: 100%;
            text-align: left;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
            width: 100%;
            max-width: 600px;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid #e0e6ed;
            border-radius: var(--border-radius);
            padding: 16px 10px;
            min-height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.04);
            transition: transform 0.12s ease;
        }

        .card:active {
            transform: scale(0.96);
        }

        .card-icon {
            font-size: 2.2rem;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            text-align: center;
            line-height: 1.2;
        }

        /* MODUL VIEW */
        .module-view {
            display: none;
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: var(--border-radius);
            padding: 20px 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            text-align: center;
        }

        .btn-back {
            background-color: #e2e8f0;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 16px;
        }

        .interactive-display {
            font-size: 3.5rem;
            margin: 12px 0;
            cursor: pointer;
        }

        /* EXACTLY 3 OPTIONS GRID FOR MOBILE OPTIMIZATION */
        .options-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 16px;
            width: 100%;
        }

        .btn-opt {
            background: #edf2f7;
            border: 2px solid #cbd5e0;
            border-radius: 14px;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 16px 8px;
            cursor: pointer;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-opt:active {
            background: var(--accent-color);
            color: white;
        }

        /* ZEHNERFELD GRID */
        .zehnerfeld-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            background: #f7fafc;
            border: 2px solid #cbd5e0;
            border-radius: 14px;
            padding: 12px;
            max-width: 320px;
            margin: 12px auto;
        }

        .field-dot {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #e2e8f0;
            margin: auto;
        }

        .field-dot.active {
            background: #e53e3e;
        }

        .step-box {
            background: #edf2f7;
            padding: 12px;
            border-radius: 10px;
            margin: 8px 0;
            font-size: 1.2rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- HAUPTMENÜ -->
    <div id="main-menu" style="width: 100%; max-width: 600px;">
        <h1>Schul App</h1>

        <!-- KLASSE 1 -->
        <div class="section-title">🎒 Klasse 1 (Schuleingangsphase)</div>
        <div class="grid-container">
            <div class="card" onclick="startAnlauteModul()">
                <div class="card-icon">🔤</div>
                <div class="card-title">Anlaute hören</div>
            </div>
            <div class="card" onclick="startSilbenModul()">
                <div class="card-icon">🌊</div>
                <div class="card-title">Silben schwingen</div>
            </div>
            <div class="card" onclick="startZehnerfeldModul()">
                <div class="card-icon">🔢</div>
                <div class="card-title">Zehnerfeld bis 10</div>
            </div>
        </div>

        <!-- KLASSE 3 -->
        <div class="section-title">📘 Klasse 3 (Orientierungsstufe)</div>
        <div class="grid-container">
            <div class="card" onclick="start1x1Modul()">
                <div class="card-icon">⚡</div>
                <div class="card-title">1x1 Blitzrechnen</div>
            </div>
            <div class="card" onclick="startZehnerMultiModul()">
                <div class="card-icon">🔢</div>
                <div class="card-title">Zehner-Multiplikation</div>
            </div>
            <div class="card" onclick="startHalbschriftlichMulModul()">
                <div class="card-icon">🧮</div>
                <div class="card-title">Halbschriftlich Mal</div>
            </div>
            <div class="card" onclick="startWortartenModul()">
                <div class="card-icon">🏷️</div>
                <div class="card-title">Wortarten bestimmen</div>
            </div>
            <div class="card" onclick="startRechtschreibungModul()">
                <div class="card-icon">✏️</div>
                <div class="card-title">Rechtschreibung üben</div>
            </div>
        </div>
    </div>

    <!-- MODUL CONTAINER -->
    <div id="module-container" class="module-view">
        <button class="btn-back" onclick="closeModule()">⬅️ Zurück zum Menü</button>
        <h2 id="module-title" style="font-size: 1.3rem; margin-bottom: 12px;">Modul</h2>
        <div id="module-content"></div>
    </div>

    <script>
        let audioUnlocked = false;
        const currentAudio = new Audio();

        function unlockAudioContext() {
            if (!audioUnlocked) {
                currentAudio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQQAAAAAAA==";
                currentAudio.play().then(() => { audioUnlocked = true; }).catch(() => {});
            }
        }
        document.body.addEventListener('touchstart', unlockAudioContext, { once: true });
        document.body.addEventListener('click', unlockAudioContext, { once: true });

        function playAudio(audioFileName) {
            unlockAudioContext();
            currentAudio.pause();
            currentAudio.currentTime = 0;
            currentAudio.src = `audio/${audioFileName}.mp3`;
            currentAudio.play().catch(() => {});
        }

        function shuffle(array) {
            let a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function openContainer(titleText) {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('module-container').style.display = 'block';
            document.getElementById('module-title').innerText = titleText;
        }

        function closeModule() {
            currentAudio.pause();
            document.getElementById('module-container').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
        }

        // 1. ANLAUTE HÖREN (3 ANTWORTEN)
        const anlautePool = [
            { icon: "🍎", audio: "silbe_apfel", ans: "A", opts: ["A", "M", "S"] },
            { icon: "🐻", audio: "silbe_baer", ans: "B", opts: ["B", "K", "F"] },
            { icon: "🐱", audio: "silbe_katze", ans: "K", opts: ["K", "L", "R"] },
            { icon: "🐟", audio: "silbe_fisch", ans: "F", opts: ["F", "N", "T"] },
            { icon: "🐶", audio: "silbe_hund", ans: "H", opts: ["H", "S", "B"] }
        ];
        let anlauteShuffled = [], anlautIdx = 0;

        function startAnlauteModul() {
            openContainer('Anlaute hören');
            playAudio('modul_anlaute');
            anlauteShuffled = shuffle(anlautePool);
            anlautIdx = 0;
            renderAnlaute();
        }

        function renderAnlaute() {
            const item = anlauteShuffled[anlautIdx];
            const content = document.getElementById('module-content');
            content.innerHTML = `
                <p style="font-size: 1.1rem; margin-bottom: 8px;">Welcher Anlaut passt?</p>
                <div class="interactive-display" onclick="playAudio('${item.audio}')">${item.icon}</div>
                <div class="options-grid-3">
                    ${shuffle(item.opts).map(opt => `
                        <button class="btn-opt" onclick="checkAnlaut('${opt}', '${item.ans}')">${opt}</button>
                    `).join('')}
                </div>
            `;
            setTimeout(() => playAudio(item.audio), 300);
        }

        function checkAnlaut(selected, correct) {
            if (selected === correct) {
                anlautIdx = (anlautIdx + 1) % anlauteShuffled.length;
                renderAnlaute();
            } else { playAudio('feedback_falsch'); }
        }

        // 2. SILBEN SCHWINGEN (3 ANTWORTEN)
        const silbenPool = [
            { icon: "🐶", audio: "silbe_hund", count: 1, opts: [1, 2, 3] },
            { icon: "🐱", audio: "silbe_katze", count: 2, opts: [1, 2, 3] },
            { icon: "🍌", audio: "silbe_banane", count: 3, opts: [2, 3, 4] },
            { icon: "🍆", audio: "silbe_aubergine", count: 4, opts: [3, 4, 5] },
            { icon: "🐞", audio: "silbe_marienkaefer", count: 5, opts: [3, 4, 5] }
        ];
        let silbenShuffled = [], silbenIdx = 0;

        function startSilbenModul() {
            openContainer('Silben schwingen');
            playAudio('modul_silben');
            silbenShuffled = shuffle(silbenPool);
            silbenIdx = 0;
            renderSilben();
        }

        function renderSilben() {
            const item = silbenShuffled[silbenIdx];
            const content = document.getElementById('module-content');
            content.innerHTML = `
                <p style="font-size: 1.1rem; margin-bottom: 8px;">Wie viele Silben hörst du?</p>
                <div class="interactive-display" onclick="playAudio('${item.audio}')">${item.icon}</div>
                <div class="options-grid-3">
                    ${item.opts.map(n => `
                        <button class="btn-opt" onclick="checkSilben(${n}, ${item.count})">${n}</button>
                    `).join('')}
                </div>
            `;
            setTimeout(() => playAudio(item.audio), 300);
        }

        function checkSilben(selected, correct) {
            if (selected === correct) {
                silbenIdx = (silbenIdx + 1) % silbenShuffled.length;
                renderSilben();
            } else { playAudio('feedback_falsch'); }
        }

        // 3. ZEHNERFELD BIS 10 (3 ANTWORTEN EXKLUSIV FÜR MOBIL-DESIGNS)
        let currentZehner = 5;

        function startZehnerfeldModul() {
            openContainer('Zehnerfeld bis 10');
            playAudio('modul_zehnerfeld');
            nextZehnerTask();
        }

        function nextZehnerTask() {
            currentZehner = Math.floor(Math.random() * 10) + 1;
            const content = document.getElementById('module-content');

            let dotsHtml = '';
            for (let i = 1; i <= 10; i++) {
                dotsHtml += `<div class="field-dot ${i <= currentZehner ? 'active' : ''}"></div>`;
            }

            // Generiere genau 3 Optionen (1 korrekte + 2 Ablenker)
            let wrong1 = currentZehner + (Math.random() < 0.5 ? 1 : -1);
            if (wrong1 < 1 || wrong1 > 10) wrong1 = currentZehner === 10 ? 8 : currentZehner + 2;
            
            let wrong2 = currentZehner + (Math.random() < 0.5 ? 2 : -2);
            if (wrong2 < 1 || wrong2 > 10 || wrong2 === wrong1) wrong2 = currentZehner === 1 ? 3 : Math.max(1, currentZehner - 1);
            if (wrong2 === wrong1) wrong2 = (wrong1 % 10) + 1;

            const opts3 = shuffle([currentZehner, wrong1, wrong2]);

            content.innerHTML = `
                <p style="font-size: 1.1rem; margin-bottom: 8px;">Wie viele Punkte siehst du?</p>
                <div class="zehnerfeld-grid">${dotsHtml}</div>
                <div class="options-grid-3">
                    ${opts3.map(n => `
                        <button class="btn-opt" onclick="checkZehner(${n})">${n}</button>
                    `).join('')}
                </div>
            `;
            setTimeout(() => playAudio(`zahl_${currentZehner}`), 300);
        }

        function checkZehner(val) {
            if (val === currentZehner) { nextZehnerTask(); }
            else { playAudio('feedback_falsch'); }
        }

        // 4. 1x1 BLITZRECHNEN (3 ANTWORTEN)
        let task1x1 = {};

        function start1x1Modul() {
            openContainer('1x1 Blitzrechnen');
            playAudio('modul_1x1');
            next1x1();
        }

        function next1x1() {
            const a = [2, 3, 4, 5, 10][Math.floor(Math.random() * 5)];
            const b = Math.floor(Math.random() * 10) + 1;
            const ans = a * b;
            const opts = shuffle([ans, ans + 2, Math.max(1, ans - 3)]);
            task1x1 = { ans };
            const content = document.getElementById('module-content');
            content.innerHTML = `
                <p style="font-size: 1.1rem; margin-bottom: 8px;">Berechne die Aufgabe:</p>
                <div class="interactive-display" style="font-weight: bold; color: var(--accent-color);">${a} × ${b}</div>
                <div class="options-grid-3">
                    ${opts.map(o => `<button class="btn-opt" onclick="check1x1(${o})">${o}</button>`).join('')}
                </div>
            `;
        }

        function check1x1(val) {
            if (val === task1x1.ans) { next1x1(); }
            else { playAudio('feedback_falsch'); }
        }

        // 5. ZEHNER-MULTIPLIKATION (3 ANTWORTEN)
        let currentZehnerTask = {};

        function startZehnerMultiModul() {
            openContainer('Zehner-Multiplikation');
            playAudio('modul_zehnermulti');
            nextZehnerMultiTask();
        }

        function nextZehnerMultiTask() {
            const a = Math.floor(Math.random() * 8) + 2;
            const b = (Math.floor(Math.random() * 9) + 1) * 10;
            const ans = a * b;
            const opts = shuffle([ans, ans + 20, Math.max(10, ans - 30)]);
            currentZehnerTask = { ans };
            const content = document.getElementById('module-content');
            content.innerHTML = `
                <p style="font-size: 1.1rem; margin-bottom: 8px;">Berechne die Aufgabe (bis 1000):</p>
                <div class="interactive-display" style="font-weight: bold; color: var(--accent-color);">${a} × ${b}</div>
                <div class="options-grid-3">
                    ${opts.map(o => `<button class="btn-opt" onclick="checkZehnerMulti(${o})">${o}</button>`).join('')}
                </div>
            `;
        }

        function checkZehnerMulti(val) {
            if (val === currentZehnerTask.ans) { nextZehnerMultiTask(); }
            else { playAudio('feedback_falsch'); }
        }

        // 6. HALBSCHRIFTLICHE MULTIPLIKATION (3 ANTWORTEN)
        let halbschrifTask = {};

        function startHalbschriftlichMulModul() {
            openContainer('Halbschriftlich Mal');
            playAudio('modul_halbschriftlich_mul');
            nextHalbschriftlichTask();
        }

        function nextHalbschriftlichTask() {
            const a = Math.floor(Math.random() * 5) + 3;
            const tens = (Math.floor(Math.random() * 4) + 1) * 10;
            const ones = Math.floor(Math.random() * 8) + 1;
            const b = tens + ones;
            const step1 = a * tens;
            const step2 = a * ones;
            const ans = step1 + step2;
            halbschrifTask = { ans };
            const content = document.getElementById('module-content');
            content.innerHTML = `
                <p style="font-size: 1.1rem; margin-bottom: 8px;">Halbschriftliche Zerlegung:</p>
                <div class="interactive-display" style="font-weight: bold; color: var(--accent-color);">${a} × ${b}</div>
                <div class="step-box">${a} × ${tens} = ${step1}</div>
                <div class="step-box">${a} × ${ones} = ${step2}</div>
                <p style="font-size: 1rem;">Ergebnis (${step1} + ${step2}):</p>
                <div class="options-grid-3">
                    ${shuffle([ans, ans + 10, Math.max(1, ans - 5)]).map(o => `
                        <button class="btn-opt" onclick="checkHalbschriftlich(${o})">${o}</button>
                    `).join('')}
                </div>
            `;
        }

        function checkHalbschriftlich(val) {
            if (val === halbschrifTask.ans) { nextHalbschriftlichTask(); }
            else { playAudio('feedback_falsch'); }
        }

        // 7. WORTARTEN BESTIMMEN (3 WORTARTEN BUTTONS)
        const wortartenPool = [
            { wort: "Haus", audio: "wort_haus", type: "Nomen" },
            { wort: "laufen", audio: "wort_laufen", type: "Verb" },
            { wort: "schnell", audio: "wort_schnell", type: "Adjektiv" },
            { wort: "Baum", audio: "wort_baum", type: "Nomen" },
            { wort: "springen", audio: "wort_springen", type: "Verb" },
            { wort: "laut", audio: "wort_laut", type: "Adjektiv" }
        ];
        let wortartenShuffled = [], wortartenIdx = 0;

        function startWortartenModul() {
            openContainer('Wortarten bestimmen');
            playAudio('modul_wortarten');
            wortartenShuffled = shuffle(wortartenPool);
            wortartenIdx = 0;
            renderWortarten();
        }

        function renderWortarten() {
            const item = wortartenShuffled[wortartenIdx];
            const content = document.getElementById('module-content');
            content.innerHTML = `
                <p style="font-size: 1.1rem; margin-bottom: 8px;">Welche Wortart ist das?</p>
                <div class="interactive-display" style="font-size: 2.8rem; font-weight: bold;" onclick="playAudio('${item.audio}')">"${item.wort}"</div>
                <div class="options-grid-3">
                    <button class="btn-opt" style="font-size: 0.95rem;" onclick="checkWortart('Nomen')">Nomen<br>(Wer/Was?)</button>
                    <button class="btn-opt" style="font-size: 0.95rem;" onclick="checkWortart('Verb')">Verb<br>(Was tun?)</button>
                    <button class="btn-opt" style="font-size: 0.95rem;" onclick="checkWortart('Adjektiv')">Adjektiv<br>(Wie?)</button>
                </div>
            `;
            setTimeout(() => playAudio(item.audio), 300);
        }

        function checkWortart(selected) {
            const item = wortartenShuffled[wortartenIdx];
            if (selected === item.type) {
                wortartenIdx = (wortartenIdx + 1) % wortartenShuffled.length;
                renderWortarten();
            } else { playAudio('feedback_falsch'); }
        }

        // 8. RECHTSCHREIB-TRAINER
        const rechtschreibPool = [
            { display: "Hun_ (Hunde)", audio: "rs_hund", correct: "d", opts: ["d", "t"] },
            { display: "Han_ (Hände)", audio: "rs_hand", correct: "d", opts: ["d", "t"] },
            { display: "Wal_ (Wälder)", audio: "rs_wald", correct: "d", opts: ["d", "t"] },
            { display: "Bro_ (Brote)", audio: "rs_brod", correct: "t", opts: ["d", "t"] }
        ];
        let rechtschreibShuffled = [], rechtschreibIdx = 0;

        function startRechtschreibungModul() {
            openContainer('Rechtschreibung üben');
            playAudio('modul_rechtschreibung');
            rechtschreibShuffled = shuffle(rechtschreibPool);
            rechtschreibIdx = 0;
            renderRechtschreibung();
        }

        function renderRechtschreibung() {
            const item = rechtschreibShuffled[rechtschreibIdx];
            const content = document.getElementById('module-content');
            content.innerHTML = `
                <p style="font-size: 1.1rem; margin-bottom: 8px;">Strategie Verlängern:</p>
                <div class="interactive-display" style="font-size: 2.8rem; font-weight: bold;" onclick="playAudio('${item.audio}')">${item.display}</div>
                <div class="options-grid-3" style="grid-template-columns: repeat(2, 1fr);">
                    ${item.opts.map(o => `<button class="btn-opt" onclick="checkRechtschreibung('${o}', '${item.correct}')">${o}</button>`).join('')}
                </div>
            `;
            setTimeout(() => playAudio(item.audio), 300);
        }

        function checkRechtschreibung(selected, correct) {
            if (selected === correct) {
                rechtschreibIdx = (rechtschreibIdx + 1) % rechtschreibShuffled.length;
                renderRechtschreibung();
            } else { playAudio('feedback_falsch'); }
        }
    </script>
</body>
</html>
