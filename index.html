<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Schul App - Lernportal</title>
    <style>
        :root {
            --primary-color: #2b7fff;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --accent-yellow: #ffdb58;
            --accent-green: #2ecc71;
            --btn-hover: #1a62d1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            background-color: var(--primary-color);
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: sticky;
            top: 0;
            z-index: 90;
        }

        .btn-nav {
            background: #ffffff;
            color: var(--primary-color);
            border: 2px solid #ffffff;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            min-height: 48px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: transform 0.1s ease;
        }

        .btn-nav:active {
            transform: scale(0.95);
        }

        .score-badge {
            background-color: #1a62d1;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
        }

        /* Overlay & Drawer Menu */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(2px);
            z-index: 100;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .drawer-overlay.open {
            opacity: 1;
            visibility: visible;
        }

        .drawer-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 82%;
            max-width: 340px;
            height: 100vh;
            background: #ffffff;
            z-index: 101;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 4px 0 15px rgba(0,0,0,0.15);
            transform: translateX(-100%);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
        }

        .drawer-menu.open {
            transform: translateX(0);
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #edf2f7;
        }

        .drawer-title {
            font-size: 1.4rem;
            color: var(--primary-color);
            font-weight: bold;
        }

        .drawer-close-btn {
            background: none;
            border: none;
            font-size: 1.6rem;
            color: #a0aec0;
            cursor: pointer;
            padding: 4px 8px;
        }

        .category-title {
            font-size: 0.85rem;
            font-weight: 800;
            color: #a0aec0;
            letter-spacing: 1px;
            margin-top: 8px;
            text-transform: uppercase;
        }

        .module-item-btn {
            background: #f7fafc;
            border: 1px solid #edf2f7;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #2d3748;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            text-align: left;
            transition: all 0.15s ease;
        }

        .module-item-btn.active {
            border: 2px solid var(--primary-color);
            background: #ebf8ff;
            color: var(--primary-color);
        }

        .module-item-btn:active {
            transform: scale(0.97);
        }

        /* Container */
        .app-container {
            width: 92%;
            max-width: 480px;
            background: var(--card-bg);
            margin-top: 20px;
            margin-bottom: 30px;
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
        }

        .main-title {
            color: var(--primary-color);
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 16px;
        }

        .instruction-box {
            width: 100%;
            text-align: left;
            margin-bottom: 16px;
            padding: 0 4px;
        }

        .instruction-text {
            font-size: 1.25rem;
            color: #2c3e50;
            font-weight: 700;
            line-height: 1.4;
            white-space: normal;
            word-wrap: break-word;
        }

        .audio-btn {
            background-color: var(--accent-yellow);
            border: none;
            padding: 12px 20px;
            border-radius: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            color: #2c3e50;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            min-height: 52px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .audio-btn:active {
            transform: scale(0.98);
        }

        .display-card {
            background-color: #f8fafc;
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            margin-bottom: 24px;
            border: 1px solid #e2e8f0;
        }

        .word-display {
            font-size: 3rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
            color: #1e293b;
        }

        .missing-letter {
            color: var(--primary-color);
            border-bottom: 4px solid var(--primary-color);
            padding-bottom: 2px;
        }

        .hint-text {
            color: #64748b;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .option-btn {
            background: white;
            border: 3px solid var(--primary-color);
            color: var(--primary-color);
            font-size: 1.8rem;
            font-weight: bold;
            padding: 16px 8px;
            border-radius: 20px;
            cursor: pointer;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.1s ease, transform 0.1s ease;
        }

        .option-btn:active {
            background-color: var(--primary-color);
            color: white;
            transform: scale(0.96);
        }
    </style>
</head>
<body>

    <!-- Navigation Header -->
    <div class="top-bar">
        <button class="btn-nav" onclick="toggleMenu(true)">
            <span>≡</span> <span id="currentModuleName">Rechtschreibung</span>
        </button>
        <div class="score-badge" id="scoreDisplay">Punkte: 90</div>
    </div>

    <!-- Drawer Overlay Menu -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleMenu(false)"></div>
    <div class="drawer-menu" id="drawerMenu">
        <div class="drawer-header">
            <div class="drawer-title">Modul wählen</div>
            <button class="drawer-close-btn" onclick="toggleMenu(false)">✕</button>
        </div>

        <div class="category-title">1. Klasse</div>
        <button class="module-item-btn" id="btn-anlaute" onclick="selectModule('anlaute')">
            <span>🔊</span> Anlaute hören
        </button>
        <button class="module-item-btn" id="btn-silben" onclick="selectModule('silben')">
            <span>🌊</span> Silben schwingen
        </button>
        <button class="module-item-btn" id="btn-zehnerfeld" onclick="selectModule('zehnerfeld')">
            <span>🔴</span> Zehnerfeld
        </button>

        <div class="category-title">3. Klasse</div>
        <button class="module-item-btn" id="btn-1x1" onclick="selectModule('1x1')">
            <span>🧮</span> 1x1 Blitzrechnen
        </button>
        <button class="module-item-btn" id="btn-halbschriftlich" onclick="selectModule('halbschriftlich')">
            <span>➕</span> Halbschriftlich
        </button>
        <button class="module-item-btn" id="btn-wortarten" onclick="selectModule('wortarten')">
            <span>📝</span> Wortarten bestimmen
        </button>
        <button class="module-item-btn active" id="btn-rechtschreibung" onclick="selectModule('rechtschreibung')">
            <span>✏️</span> Rechtschreibung
        </button>
    </div>

    <!-- Übungs-Container -->
    <div class="app-container">
        <h1 class="main-title" id="exerciseMainTitle">Rechtschreibstrategien</h1>
        
        <div class="instruction-box">
            <div class="instruction-text" id="instructionText">
                Leite ab von Baum
            </div>
        </div>

        <button class="audio-btn" id="playAudioBtn">
            🔊 Wort anhören
        </button>

        <div class="display-card">
            <div class="word-display" id="wordDisplay">
                B<span class="missing-letter">?</span>
            </div>
            <div class="hint-text" id="hintText">
                💡 Tipp: Ableiten von Baum
            </div>
        </div>

        <div class="options-grid" id="optionsContainer"></div>
    </div>

    <script>
        // Datenbanken für alle Module
        const modulesData = {
            rechtschreibung: [
                { baseWord: "Baum", targetWord: "Bäume", audioFile: "audio/Baeume.mp3", prefix: "B", correctEnding: "äume", wrongEnding: "ume" },
                { baseWord: "Bär", targetWord: "Bären", audioFile: "audio/Baeren.mp3", prefix: "B", correctEnding: "ären", wrongEnding: "eren" },
                { baseWord: "Haus", targetWord: "Häuser", audioFile: "audio/Haeuser.mp3", prefix: "H", correctEnding: "äuser", wrongEnding: "euser" },
                { baseWord: "Hand", targetWord: "Hände", audioFile: "audio/Haende.mp3", prefix: "H", correctEnding: "ände", wrongEnding: "ende" }
            ],
            anlaute: [
                { baseWord: "Affe", targetWord: "Affe", audioFile: "audio/Affe.mp3", prefix: "", correctEnding: "A", wrongEnding: "O" },
                { baseWord: "Bär", targetWord: "Bär", audioFile: "audio/Baer.mp3", prefix: "", correctEnding: "B", wrongEnding: "D" },
                { baseWord: "Elefant", targetWord: "Elefant", audioFile: "audio/Elefant.mp3", prefix: "", correctEnding: "E", wrongEnding: "I" }
            ],
            "1x1": [
                { baseWord: "3 × 4", targetWord: "12", audioFile: "", prefix: "3 × 4 = ", correctEnding: "12", wrongEnding: "14" },
                { baseWord: "5 × 5", targetWord: "25", audioFile: "", prefix: "5 × 5 = ", correctEnding: "25", wrongEnding: "20" },
                { baseWord: "7 × 8", targetWord: "56", audioFile: "", prefix: "7 × 8 = ", correctEnding: "56", wrongEnding: "54" }
            ]
        };

        let currentModuleKey = 'rechtschreibung';
        let currentTaskIndex = 0;
        let score = parseInt(localStorage.getItem('schulapp_score') || '90');
        window.activeAudio = null;

        function toggleMenu(open) {
            const overlay = document.getElementById('drawerOverlay');
            const menu = document.getElementById('drawerMenu');
            if (open) {
                overlay.classList.add('open');
                menu.classList.add('open');
            } else {
                overlay.classList.remove('open');
                menu.classList.remove('open');
            }
        }

        function selectModule(moduleId) {
            toggleMenu(false);
            document.querySelectorAll('.module-item-btn').forEach(btn => btn.classList.remove('active'));

            const activeBtn = document.getElementById(`btn-${moduleId}`);
            if (activeBtn) activeBtn.classList.add('active');

            const names = {
                'anlaute': 'Anlaute hören',
                'silben': 'Silben schwingen',
                'zehnerfeld': 'Zehnerfeld',
                '1x1': '1x1 Blitzrechnen',
                'halbschriftlich': 'Halbschriftlich',
                'wortarten': 'Wortarten bestimmen',
                'rechtschreibung': 'Rechtschreibung'
            };

            currentModuleKey = modulesData[moduleId] ? moduleId : 'rechtschreibung';
            currentTaskIndex = 0;

            document.getElementById('currentModuleName').innerText = names[moduleId] || 'Modul';
            document.getElementById('exerciseMainTitle').innerText = names[moduleId] || 'Übung';

            renderTask();
        }

        function playAudio(audioPath) {
            if (!audioPath) return;
            if (window.activeAudio) {
                window.activeAudio.pause();
                window.activeAudio.currentTime = 0;
            }
            window.activeAudio = new Audio(audioPath);
            window.activeAudio.play().catch(err => console.warn("Audio-Hinweis:", err));
        }

        function renderTask() {
            const moduleList = modulesData[currentModuleKey] || modulesData['rechtschreibung'];
            const task = moduleList[currentTaskIndex % moduleList.length];

            if (currentModuleKey === 'rechtschreibung') {
                document.getElementById('instructionText').innerText = `Leite ab von ${task.baseWord}`;
                document.getElementById('wordDisplay').innerHTML = `${task.prefix}<span class="missing-letter">?</span>`;
                document.getElementById('hintText').innerText = `💡 Tipp: Ableiten von ${task.baseWord}`;
            } else if (currentModuleKey === 'anlaute') {
                document.getElementById('instructionText').innerText = `Welcher Anlaut gehört dazu?`;
                document.getElementById('wordDisplay').innerHTML = `<span class="missing-letter">?</span> ${task.baseWord.slice(1)}`;
                document.getElementById('hintText').innerText = `💡 Höre genau auf den ersten Laut`;
            } else if (currentModuleKey === '1x1') {
                document.getElementById('instructionText').innerText = `Berechne das Ergebnis`;
                document.getElementById('wordDisplay').innerHTML = `${task.prefix}<span class="missing-letter">?</span>`;
                document.getElementById('hintText').innerText = `💡 Blitzrechnen`;
            }

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            const options = [
                { text: task.correctEnding, isCorrect: true },
                { text: task.wrongEnding, isCorrect: false }
            ];

            for (let i = options.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [options[i], options[j]] = [options[j], options[i]];
            }

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt.text;
                btn.onclick = () => checkAnswer(opt.isCorrect);
                optionsContainer.appendChild(btn);
            });

            const audioBtn = document.getElementById('playAudioBtn');
            if (task.audioFile) {
                audioBtn.style.display = 'flex';
                audioBtn.onclick = () => playAudio(task.audioFile);
            } else {
                audioBtn.style.display = 'none';
            }
        }

        function checkAnswer(isCorrect) {
            if (isCorrect) {
                score += 10;
                localStorage.setItem('schulapp_score', score.toString());
                document.getElementById('scoreDisplay').innerText = `Punkte: ${score}`;
                currentTaskIndex++;
                renderTask();
            } else {
                const container = document.getElementById('optionsContainer');
                container.style.transform = 'translateX(-6px)';
                setTimeout(() => container.style.transform = 'translateX(6px)', 50);
                setTimeout(() => container.style.transform = 'translateX(0)', 100);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('scoreDisplay').innerText = `Punkte: ${score}`;
            renderTask();
        });
    </script>
</body>
</html>
