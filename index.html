<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Schul App - Rechtschreibstrategien</title>
  <style>
    :root {
      --primary-color: #3b82f6;
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --accent-yellow: #fde047;
      --accent-yellow-border: #eab308;
      --success-color: #22c55e;
      --error-color: #ef4444;
      --text-dark: #1e293b;
      --border-radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      border-radius: var(--border-radius);
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .title {
      color: var(--primary-color);
      font-size: 1.4rem;
      font-weight: 700;
    }

    .score-badge {
      background-color: var(--primary-color);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .instruction {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 16px;
      min-height: 1.5em;
    }

    /* OBERE BUTTON-ZEILE: Halbiert */
    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .btn-control {
      min-height: 52px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.1s, background-color 0.2s;
      border: 2px solid transparent;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-control:active {
      transform: scale(0.97);
    }

    .btn-listen {
      background-color: var(--accent-yellow);
      border-color: var(--accent-yellow-border);
      color: #713f12;
    }

    .btn-sound-toggle {
      background-color: #e2e8f0;
      border-color: #cbd5e1;
      color: var(--text-dark);
    }

    .btn-sound-toggle.active {
      background-color: #dcfce7;
      border-color: #86efac;
      color: #14532d;
    }

    /* DISPLAY BOX FÜR WORT/LÜCKE */
    .word-display-box {
      background-color: #f8fafc;
      border: 2px solid #e2e8f0;
      border-radius: var(--border-radius);
      padding: 32px 16px 20px 16px;
      margin-bottom: 24px;
      transition: border-color 0.3s ease;
    }

    .word-target {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary-color);
      letter-spacing: 2px;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.3s ease, transform 0.2s ease;
    }

    .word-target.correct {
      color: var(--success-color);
      transform: scale(1.05);
    }

    .hint-text {
      font-size: 0.9rem;
      color: #64748b;
      margin-top: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-height: 1.2em;
    }

    /* ANTWORT BUTTONS */
    .options-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .btn-option {
      min-height: 60px;
      background: #ffffff;
      border: 2px solid #93c5fd;
      border-radius: var(--border-radius);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-color);
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-option:hover {
      border-color: var(--primary-color);
      background-color: #eff6ff;
    }

    .btn-option:active {
      transform: scale(0.96);
    }

    .btn-option.btn-correct {
      background-color: #dcfce7 !important;
      border-color: var(--success-color) !important;
      color: #15803d !important;
    }

    .btn-option.btn-wrong {
      background-color: #fee2e2 !important;
      border-color: var(--error-color) !important;
      color: #b91c1c !important;
    }

    .disabled {
      pointer-events: none;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header-row">
      <h2 class="title">Rechtschreibung</h2>
      <div class="score-badge" id="scoreDisplay">Punkte: 0</div>
    </div>

    <div class="instruction" id="instructionText">Lade Wortschatz...</div>

    <div class="controls-row">
      <button class="btn-control btn-listen" id="listenBtn">
        🔊 Wort anhören
      </button>
      <button class="btn-control btn-sound-toggle active" id="soundToggleBtn">
        🔔 Ton: AN
      </button>
    </div>

    <div class="word-display-box" id="displayBox">
      <div class="word-target" id="wordDisplay">...</div>
      <div class="hint-text" id="hintText">...</div>
    </div>

    <div class="options-row" id="optionsContainer">
      <button class="btn-option" id="btnOpt1" data-index="0">-</button>
      <button class="btn-option" id="btnOpt2" data-index="1">-</button>
    </div>
  </div>

  <script>
    // --- FALLBACK-DATEN (Falls JSON nicht geladen werden kann) ---
    const fallbackTasks = [
      { baseWord: "Hand", gapText: "H?", fullWord: "Hände", instruction: "Leite ab von Hand", hint: "💡 Tipp: Ableiten von Hand", options: ["ände", "ende"], correctIndex: 0 },
      { baseWord: "Haus", gapText: "H?", fullWord: "Häuser", instruction: "Leite ab von Haus", hint: "💡 Tipp: Ableiten von Haus", options: ["euser", "äuser"], correctIndex: 1 }
    ];

    let tasks = [];
    let currentTaskIndex = 0;
    let score = 0;
    let isAudioFeedbackEnabled = true;
    let isEvaluating = false;

    // --- DOM ELEMENTE ---
    const instructionText = document.getElementById('instructionText');
    const listenBtn = document.getElementById('listenBtn');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const wordDisplay = document.getElementById('wordDisplay');
    const hintText = document.getElementById('hintText');
    const optionsContainer = document.getElementById('optionsContainer');
    const btnOpt1 = document.getElementById('btnOpt1');
    const btnOpt2 = document.getElementById('btnOpt2');
    const scoreDisplay = document.getElementById('scoreDisplay');
    const displayBox = document.getElementById('displayBox');

    // --- AUDIO (Web Speech API) ---
    function speakText(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        utterance.rate = 0.85;
        window.speechSynthesis.speak(utterance);
      }
    }

    // --- WORTSCHATZ LADEN (JSON FETCH) ---
    async function loadTasks() {
      try {
        const response = await fetch('words.json');
        if (!response.ok) throw new Error('Netzwerk-Fehler beim Laden der JSON');
        tasks = await response.json();
      } catch (error) {
        console.warn('words.json konnte nicht geladen werden, nutze Fallback-Daten:', error);
        tasks = fallbackTasks;
      }
      renderTask();
    }

    // --- RENDERUNG ---
    function renderTask() {
      if (!tasks || tasks.length === 0) return;

      const task = tasks[currentTaskIndex];

      isEvaluating = false;
      optionsContainer.classList.remove('disabled');
      wordDisplay.classList.remove('correct');
      displayBox.style.borderColor = '#e2e8f0';

      [btnOpt1, btnOpt2].forEach(btn => {
        btn.classList.remove('btn-correct', 'btn-wrong');
      });

      instructionText.textContent = task.instruction;
      wordDisplay.textContent = task.gapText;
      hintText.textContent = task.hint;
      btnOpt1.textContent = task.options[0];
      btnOpt2.textContent = task.options[1];
    }

    function handleOptionClick(selectedIndex, clickedBtn) {
      if (isEvaluating) return;

      const task = tasks[currentTaskIndex];

      if (selectedIndex === task.correctIndex) {
        isEvaluating = true;
        optionsContainer.classList.add('disabled');

        // Wort auflösen & grün hervorheben
        wordDisplay.textContent = task.fullWord;
        wordDisplay.classList.add('correct');
        clickedBtn.classList.add('btn-correct');

        score += 10;
        scoreDisplay.textContent = `Punkte: ${score}`;

        // Sprachausgabe (ohne Glucksen/Synthesizer-Sound)
        if (isAudioFeedbackEnabled) {
          speakText(task.fullWord);
        }

        // Exakt 2 Sekunden Verweilzeit, dann nächste Aufgabe
        setTimeout(() => {
          currentTaskIndex = (currentTaskIndex + 1) % tasks.length;
          renderTask();
        }, 2000);

      } else {
        clickedBtn.classList.add('btn-wrong');
        setTimeout(() => {
          clickedBtn.classList.remove('btn-wrong');
        }, 800);
      }
    }

    // --- EVENT LISTENER ---
    listenBtn.addEventListener('click', () => {
      if (tasks.length > 0) {
        speakText(tasks[currentTaskIndex].fullWord);
      }
    });

    soundToggleBtn.addEventListener('click', () => {
      isAudioFeedbackEnabled = !isAudioFeedbackEnabled;
      
      if (isAudioFeedbackEnabled) {
        soundToggleBtn.textContent = '🔔 Ton: AN';
        soundToggleBtn.classList.add('active');
      } else {
        soundToggleBtn.textContent = '🔕 Ton: AUS';
        soundToggleBtn.classList.remove('active');
      }
    });

    btnOpt1.addEventListener('click', () => handleOptionClick(0, btnOpt1));
    btnOpt2.addEventListener('click', () => handleOptionClick(1, btnOpt2));

    // Start
    loadTasks();
  </script>
</body>
</html>
